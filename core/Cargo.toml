[workspace]
resolver = "2"
members = ["crates/safety-core", "crates/safety-crypto", "crates/safety-ffi", "crates/sim", "crates/safety-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = false   # uniffi-bindgen --library reads symbols from the .so; strip in the app bundle instead
