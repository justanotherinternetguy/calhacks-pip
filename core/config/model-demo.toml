# Demo-sensitivity override. Partial file: every key not listed here falls back to model-v1.toml
# (Config::from_toml deep-merges). Loaded by Settings → "Demo sensitivity" so a judge can trigger
# incidents by hand in a room. NOT for real use: it trades false alarms for reproducibility.

[impact]
incident_peak_g = 3.0          # same as v1: a hard hit, not a slap (was 1.8)
peak_g = 3.0                   # hard-peak threshold for the fall pattern (v1: 3.0)
orientation_change_deg = 10.0  # a small tilt after the hit counts (v1: 45)
post_still_rms_g = 0.25        # "still after" is lenient (v1: 0.15)
# Disable the "phone dropped alone" discrimination for demos: a bare phone dropped on a couch is
# exactly what a judge will do, and in v1 that is (correctly) classified as a drop, not a fall.
drop_flat_gz = 1.5             # never "flat" (|gz| ≤ 1), so no event is classed as a drop (v1: 0.85)
drop_min_free_fall_ms = 100000

[grab]
jerk_g_per_s = 20.0            # a sharp yank (v1: 50)
rotation_deg_per_s = 150.0     # a quick twist (v1: 300)
confirm_s = 2                  # 2 s of jogging/fast movement confirms (v1: 4)
in_hand_touch_s = 10.0         # touched within 10 s counts as in hand (v1: 2)

[incidents]
unsteady_persist_s = 12        # 12 s of odd walking = unsteady gait (v1: 35)
slowed_persist_s = 15          # (v1: 60)
down_after_fall_s = 15         # (v1: 15)
separated_min = 1              # (v1: 10)
stopped_min = 1                # (v1: 10)
left_behind_min = 2            # (v1: 20)

[signals]
band_sd_untrusted = 2.5        # tighter bands while the baseline is untrusted (v1: 3.5; was 2.0 before the pocket calibration)

[thresholds]
check_deadline_s = 30          # check-in window (v1: 120)
unlock_no_response_s = 60      # location unlock 60 s after the check if it still holds (v1: 240)
call_option_s = 90             # call option after 90 s (v1: 600)
grab_unlock_s = 30             # grab: unlock after 30 s unless the owner unlocks (v1: 120)
check_repeat_cooldown_s = 15   # a new check-in can follow 15 s after the last one, for back-to-back demos (v1: 300)
# A red (Danger) incident, e.g. "down after fall", unlocks the location at once: friends' dashboards open the
# escalation dock with the map right away instead of after the check-in deadline (v1: false).
unlock_on_danger = true
