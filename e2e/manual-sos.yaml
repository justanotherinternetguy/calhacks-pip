# Manual SOS: hold button counts as consent and skips the detection bar.
# appId must match apps/mobile/app.json (android.package / ios.bundleIdentifier).
appId: com.safe.mobile
tags: [debug]
---
- launchApp:
    clearState: false
- openLink: "safe://debug/inject?trace=manual-sos"
- assertVisible: "Night mode"
- longPressOn:
    id: "sos-button"
- extendedWaitUntil:
    visible: "SOS sent"
    timeout: 15000
- assertVisible: "Location shared with your friends"
- tapOn: "Cancel SOS"
- extendedWaitUntil:
    visible: "Confirm it's you"
    timeout: 10000
