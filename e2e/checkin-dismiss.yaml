# Check-in: stumble → impact → still. 'You okay?' appears, typing the phrase dismisses it.
# appId must match apps/mobile/app.json (android.package / ios.bundleIdentifier).
appId: com.safe.mobile
tags: [debug]
---
- launchApp:
    clearState: false
- openLink: "safe://debug/inject?trace=checkin-dismiss"
- extendedWaitUntil:
    visible: "You okay?"
    timeout: 60000
- assertVisible: "Type the 3 words"
- copyTextFrom:
    id: "checkin-phrase"
- tapOn:
    id: "checkin-input"
- inputText: "${maestro.copiedText}"
- tapOn: "Done"
- extendedWaitUntil:
    visible: "Glad you're okay"
    timeout: 15000
- assertNotVisible: "You okay?"
