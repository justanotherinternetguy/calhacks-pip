// Expo module: SafetyNative (Android). Built by the app's Gradle via expo-modules autolinking.
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.safetynative'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()
useDefaultAndroidSdkVersions()   // compileSdk/targetSdk from the app (35)

android {
  namespace "expo.modules.safetynative"

  defaultConfig {
    minSdkVersion 26
    targetSdkVersion 35
    versionCode 1
    versionName "0.1.0"
    // Rust core (cargo-ndk) ships arm64 + x86_64 only.
    ndk { abiFilters "arm64-v8a", "x86_64" }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions { jvmTarget = "17" }

  sourceSets {
    main {
      // libsafety_ffi.so per ABI, produced by `cargo ndk` (see README.md)
      jniLibs.srcDirs = ['src/main/jniLibs']
      // model-v1.toml, yamnet.tflite, yamnet_class_map.csv, vosk-model-small-en-us/ (fetched by fetchVoskModel)
      assets.srcDirs = ['src/main/assets']
    }
  }

  androidResources { noCompress 'tflite' }
  buildFeatures { buildConfig false }
  lintOptions { abortOnError false }
}

// Keep assets/model-*.toml in sync with core/config (model-v1 = bundled fallback, model-demo = demo-sensitivity override).
def modelConfigDir = file("${rootProject.projectDir}/../../../core/config")
tasks.register("copyModelConfig", Copy) {
  onlyIf { modelConfigDir.isDirectory() }
  from(modelConfigDir) { include "model-*.toml" }
  into file("src/main/assets")
}
preBuild.dependsOn "copyModelConfig"

// Vosk speech model for DistressWordSpotter (Apache 2.0, ~40 MB zipped / 68 MB unpacked), not committed: fetched once
// into assets/vosk-model-small-en-us/ and checked against its SHA-256. VERSION (the model name) tells the app when
// its unpacked copy in filesDir is stale.
def voskModel = "vosk-model-small-en-us-0.15"
def voskSha256 = "30f26242c4eb449f948e42cb302dd7a686cb29a3423a8367f99ff41780942498"
def voskDir = file("src/main/assets/vosk-model-small-en-us")
tasks.register("fetchVoskModel") {
  def marker = new File(voskDir, "VERSION")
  onlyIf { !(marker.isFile() && marker.text.trim() == voskModel) }
  doLast {
    def zip = new File(temporaryDir, "${voskModel}.zip")
    new URL("https://alphacephei.com/vosk/models/${voskModel}.zip").withInputStream { i -> zip.withOutputStream { it << i } }
    def md = java.security.MessageDigest.getInstance("SHA-256")
    zip.eachByte(1 << 16) { buf, n -> md.update(buf, 0, n) }
    def got = md.digest().encodeHex().toString()
    if (got != voskSha256) throw new GradleException("${voskModel}.zip: SHA-256 ${got}, expected ${voskSha256}")
    def unz = new File(temporaryDir, "unzipped")
    project.delete(unz, voskDir)
    ant.unzip(src: zip, dest: unz)
    project.copy { from new File(unz, voskModel); into voskDir }
    marker.text = voskModel
    project.delete(unz, zip)
  }
}
preBuild.dependsOn "fetchVoskModel"

dependencies {
  // uniffi-generated Kotlin bindings (uniffi/safety/safety.kt) load libsafety_ffi.so through JNA.
  implementation "net.java.dev.jna:jna:5.14.0@aar"

  implementation "androidx.core:core-ktx:1.13.1"
  implementation "androidx.appcompat:appcompat:1.7.0"
  implementation "androidx.biometric:biometric:1.2.0-alpha05"
  implementation "androidx.security:security-crypto:1.1.0-alpha06"
  implementation "androidx.work:work-runtime-ktx:2.9.1"

  implementation "com.google.android.gms:play-services-location:21.3.0"

  implementation "org.tensorflow:tensorflow-lite:2.16.1"
  // Offline keyword recognition (DistressWordSpotter). @aar: no transitive JNA, the one above is shared.
  implementation "com.alphacephei:vosk-android:0.3.75@aar"

  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
  // org.json ships with the platform; no extra JSON dependency.
}
